name: Bug
description: Something is broken or gives wrong numbers
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Exact command, branch/commit, and the full error message.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.11.9, branch aysel/tree-split"
